name: Build & Package iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Xcode Project
        run: |
          xcodebuild -project apps/mobile/ios/AetherOS.xcodeproj \
                     -scheme AetherOS \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Sideloadable IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AetherOS.app build/Payload/
          cd build
          zip -r ../AetherOS-Sideloadable.ipa Payload
          cd ..
          ls -lh AetherOS-Sideloadable.ipa

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-Sideloadable.ipa
          path: AetherOS-Sideloadable.ipa
          if-no-files-found: error
